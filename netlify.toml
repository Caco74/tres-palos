[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  included_files = ["js/config.js"]

[[redirects]]
  from = "/equipos/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/tp-admin-7c9f2026.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/js/admin-panel.js"
  [headers.values]
    Cache-Control = "no-store"
