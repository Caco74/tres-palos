<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0A0B0D">
  <title>Página no encontrada — Tres Palos</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Inter:wght@400;600&display=swap">
  <style>
    :root { color-scheme: dark; --bg:#0a0b0d; --panel:#151516; --text:#f4f1e8; --muted:#a5a5a7; --red:#ff3045; --border:#2a2a2c; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top, #242124 0, var(--bg) 52%); color:var(--text); font-family:Inter, sans-serif; }
    main { width:min(100%, 650px); padding:clamp(28px, 6vw, 54px); border:1px solid var(--border); background:rgba(21,21,22,.96); text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.35); }
    img { width:min(100%, 260px); height:auto; }
    .code { margin:38px 0 0; color:var(--red); font-family:"Barlow Condensed", sans-serif; font-size:.8rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:8px 0 12px; font-family:"Barlow Condensed", sans-serif; font-size:clamp(2.4rem, 8vw, 4.6rem); line-height:.92; text-transform:uppercase; }
    p { max-width:460px; margin:0 auto; color:var(--muted); line-height:1.6; }
    nav { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:30px; }
    a { min-height:44px; display:inline-flex; align-items:center; justify-content:center; padding:11px 18px; border:1px solid var(--border); color:var(--text); font-family:"Barlow Condensed", sans-serif; font-weight:700; letter-spacing:.04em; text-decoration:none; text-transform:uppercase; }
    a:first-child { border-color:var(--red); background:var(--red); color:#fff; }
    a:hover { border-color:var(--red); }
    a:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/tres-palos-logo-horizontal-fondo-oscuro.svg" alt="Tres Palos" width="260" height="68">
    <div class="code">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>La dirección puede estar incompleta o haber cambiado. Volvé a una sección del torneo.</p>
    <nav aria-label="Volver a Tres Palos">
      <a href="/">Inicio</a>
      <a href="/#partidos">Partidos</a>
      <a href="/#tabla">Tabla</a>
    </nav>
  </main>
</body>
</html>
